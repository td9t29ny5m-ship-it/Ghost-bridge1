name: Validate Ghost Bridge
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check JavaScript syntax
        run: |
          node --check server.js
          node --check ghost.js
      - name: Validate package metadata
        run: node -e "const p = require('./package.json'); if (!p.scripts || !p.scripts.start) process.exit(1); console.log(p.name, p.version)"
