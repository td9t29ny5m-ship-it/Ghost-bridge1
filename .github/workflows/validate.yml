name: Validate Ghost Stream
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        run: npm install --package-lock=false --no-audit --no-fund
      - name: Check JavaScript syntax
        run: npm run check
      - name: Smoke-test HTTP service
        env:
          ADMIN_PASSWORD: ci-test-password
          PORT: 3100
        run: |
          node index.js > /tmp/ghost-stream.log 2>&1 &
          echo $! > /tmp/ghost-stream.pid
          for i in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:3100/healthz > /tmp/ghost-health.json; then
              cat /tmp/ghost-health.json
              curl --fail --silent http://127.0.0.1:3100/ > /dev/null
              kill $(cat /tmp/ghost-stream.pid) || true
              exit 0
            fi
            sleep 1
          done
          cat /tmp/ghost-stream.log
          kill $(cat /tmp/ghost-stream.pid) || true
          exit 1
