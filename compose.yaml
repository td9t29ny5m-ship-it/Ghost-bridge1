services:
  ghost-bridge:
    build: .
    container_name: ghost-bridge
    restart: unless-stopped
    init: true
    environment:
      NODE_ENV: production
      PORT: "8080"
      DATA_DIR: /app/data
      RELAY_PORT: "19134"
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      MC_BEDROCK_VERSION: ${MC_BEDROCK_VERSION:-1.21.90}
    ports:
      - "8080:8080/tcp"
      - "19134:19134/udp"
    volumes:
      - ghost_data:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "const http=require('http');const r=http.get('http://127.0.0.1:8080/healthz',x=>process.exit(x.statusCode===200?0:1));r.on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  ghost_data:
