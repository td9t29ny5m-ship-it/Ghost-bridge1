services:
  ghost-bridge:
    build: .
    container_name: ghost-bridge
    restart: unless-stopped
    init: true
    environment:
      NODE_ENV: production
      PORT: "8080"
      WEB_PORT: "8080"
      HOST: "0.0.0.0"
      RELAY_PORT: "19134"
    ports:
      - "8080:8080/tcp"
      - "19134:19134/udp"
    volumes:
      - ghost_data:/app/data
      - ghost_schematics:/app/schematics
      - ghost_uploads:/app/uploads
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  ghost_data:
  ghost_schematics:
  ghost_uploads:
