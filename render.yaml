services:
  - type: web
    name: ghost-bridge
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 20.19.0
      - key: ADMIN_PASSWORD
        sync: false
      - key: MC_BEDROCK_VERSION
        value: 1.21.90
